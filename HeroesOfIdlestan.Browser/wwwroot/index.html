<!DOCTYPE html>
<html lang="fr">
<head>

    <meta name="viewport" content="width=device-width, initial-scale=1.0, user-scalable=no, maximum-scale=1.0" />
    <title>HeroesOfIdlestan</title>
    <style>
        html, body {
            margin: 0;
            padding: 0;
            width: 100%;
            height: 100%;
            overflow: hidden;

        /* Avalonia dimensionne son canvas sur ce conteneur : sans hauteur explicite, la page reste vide. */

            width: 100%;
            height: 100%;
        }

        #loading {
            position: absolute;
            inset: 0;
            display: flex;
            align-items: center;
            justify-content: center;
            color: #e8b84a;
            font-family: system-ui, sans-serif;
            font-size: 1.1rem;
            letter-spacing: 0.08em;
            pointer-events: none;
        }
    </style>
</head>
<body>
    <div id="out"></div>
    <div id="loading">HeroesOfIdlestan…</div>
    <!-- Chemins relatifs uniquement : la page doit marcher dans le sous-dossier de GitHub Pages. -->
    <script type="module" src="./main.js"></script>
</body>
</html>
