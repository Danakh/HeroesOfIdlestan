name: Deploy web to GitHub Pages

# Voir design/06-deploiement-web.md : activer Pages (Settings > Pages > Source : GitHub Actions)
# avant le premier lancement.
on:
  # Lancement manuel depuis l'onglet Actions.
  workflow_dispatch:
  # Et à chaque tag de version (git tag v0.1.0 && git push origin v0.1.0).
  push:
    tags: [ 'v*' ]

permissions:
  contents: read
  pages: write
  id-token: write

# Un seul déploiement à la fois ; on ne coupe pas un déploiement en cours.
concurrency:
  group: pages
  cancel-in-progress: false

env:
  # Le bundle déployable est produit à cet emplacement fixe par le SDK WASM.
  APP_BUNDLE: HeroesOfIdlestan.App.Browser/bin/Release/net10.0-browser/browser-wasm/AppBundle

jobs:
  deploy:
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Setup .NET 10
        uses: actions/setup-dotnet@v6
        with:
          dotnet-version: '10.0.x'

      # Jamais de mise en ligne avec des sauvegardes cassées : les tests (fixtures comprises) d'abord.
      - name: Test
        run: dotnet test HeroesOfIdlestan.Test.Tests -c Release

      - name: Install WASM workload
        run: dotnet workload install wasm-tools

      # Pas de -o : le SDK WASM y aplatirait le contenu intermédiaire. On prend AppBundle.
      - name: Publish
        run: dotnet publish HeroesOfIdlestan.App.Browser/HeroesOfIdlestan.App.Browser.csproj -c Release

      # Pas de .nojekyll : un artefact déployé par Actions est servi tel quel, sans passer par Jekyll,
      # donc _framework/ (le runtime .NET) est publié. upload-pages-artifact ignore d'ailleurs les
      # fichiers cachés.

      - name: Setup Pages
        uses: actions/configure-pages@v6

      - name: Upload artifact
        uses: actions/upload-pages-artifact@v5
        with:
          path: ${{ env.APP_BUNDLE }}

      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v5
